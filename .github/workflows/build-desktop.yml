name: Build Desktop Artifacts

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (does not publish a release)"
        required: true
        default: "preview"
  push:
    tags:
      - "v*"

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-packaging.txt
      - name: Test
        run: python -m pip install -r requirements-dev.txt && python -m pytest -q
      - name: Build desktop bundle
        run: python scripts/build_desktop.py
      - name: Verify frozen application (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/check_desktop_bundle.py
      - name: Verify frozen application (macOS and Windows)
        if: runner.os != 'Linux'
        run: python scripts/check_desktop_bundle.py
      - name: Upload desktop diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          path: output/desktop-smoke.log
          if-no-files-found: ignore
      - name: Collect third-party notices
        run: python scripts/collect_release_licenses.py
      - name: Package release files
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
        run: python scripts/package_release.py --version "$PACKAGE_VERSION" --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
        shell: bash
      - name: Verify extracted release (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/check_release_archive.py
      - name: Verify extracted release (macOS and Windows)
        if: runner.os != 'Linux'
        run: python scripts/check_release_archive.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openavatar-studio-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or update release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes --verify-tag --draft
          gh release upload "$RELEASE_TAG" release/* --clobber
