name: 功能建议 / Feature request
description: 提出使用场景和改进建议 / Suggest a use case or improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: need
    attributes:
      label: 需要解决什么问题 / What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的使用方式 / Proposed behavior
      description: 请勿包含个人资料或密钥 / Do not include personal data or keys.
    validations:
      required: true
